  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>サッカー恋愛タイプ診断</title>

<style>

body{
font-family:sans-serif;
background:linear-gradient(#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

h1{
font-size:40px;
margin-bottom:30px;
}

.question{
font-size:24px;
margin-bottom:40px;
}

.scale{
display:flex;
justify-content:space-between;
margin:30px 0;
}

.circle{
width:45px;
height:45px;
border-radius:50%;
background:white;
opacity:0.4;
cursor:pointer;
}

.circle:hover{
opacity:1;
transform:scale(1.2);
}

.result{
font-size:22px;
line-height:1.6;
}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:#00ff88;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>⚽サッカー恋愛タイプ診断⚽</h1>

<div id="start">
<button onclick="startTest()">診断スタート</button>
</div>

<div id="quiz" style="display:none">
<div class="question" id="question"></div>

<div class="scale">
<div class="circle" onclick="answer(1)"></div>
<div class="circle" onclick="answer(2)"></div>
<div class="circle" onclick="answer(3)"></div>
<div class="circle" onclick="answer(4)"></div>
<div class="circle" onclick="answer(5)"></div>
<div class="circle" onclick="answer(6)"></div>
<div class="circle" onclick="answer(7)"></div>
<div class="circle" onclick="answer(8)"></div>
<div class="circle" onclick="answer(9)"></div>
</div>

</div>

<div id="result" class="result"></div>

</div>

<script>

let questions=[
"好きな人ができたら自分から行く",
"恋愛は勢いが大事",
"駆け引きするより直感",
"好きな人には積極的",
"恋愛で負けたくない",
"相手の気持ちをよく考える",
"自分の魅力をアピールするのが得意",
"恋愛は慎重に進める",
"好きになると止まらない",
"恋愛では冷静な方"
]

let score=0
let current=0

function startTest(){
document.getElementById("start").style.display="none"
document.getElementById("quiz").style.display="block"
showQuestion()
}

function showQuestion(){
document.getElementById("question").innerText=questions[current]
}

function answer(num){

score+=num
current++

if(current<questions.length){
showQuestion()
}else{
showResult()
}

}

function showResult(){

document.getElementById("quiz").style.display="none"

let text=""

if(score>70){
text=`【ゴール量産機!! センターフォワードの“ハリー・ケインタイプ】

好きになったら止まらない。重さで相手をねじ伏せる恋愛!!ただし、あまりにも器用すぎて相手に怖がられることもあるので要注意⚠️‼️`
}

else if(score>60){
text=`【爆速カウンター!! ストライカーキリアン・ムバッペタイプ】

●一瞬で距離詰めるけど冷めるのも早い。相手のいいところを見つけるのが上手🙌🏻ただしワンパターンすぎる恋愛に飽きられないように要注意⚠️‼️`
}

else if(score>50){
text=`【理不尽ゴラッソ FW“リオネル・メッシタイプ】

●自然にモテてるのに本人無自覚系。寄ってくる男女を無意識のうちに弄ぶようにスルーしてるモテ人間！！`
}

else{
text=`【VAR判定中‼️タイプ】

👉好きかどうか自分でも分かってない😶アディショナルタイムはたくさんあるから、まずは相手との距離を考えてみて❕️`
}

document.getElementById("result").innerText=text

}

</script>

</body>
</html>
