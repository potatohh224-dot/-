<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>恋の戦術診断スタジアム</title>

<style>

body{
font-family:sans-serif;
text-align:center;
margin:0;
background:#6fdc6f;
}

/* サッカーコート */

body:before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle,transparent 90px,white 92px,white 94px,transparent 96px),
linear-gradient(white 2px,transparent 2px),
linear-gradient(90deg,white 2px,transparent 2px);
opacity:0.25;
z-index:-1;
}

h1{
font-size:38px;
margin-top:30px;
}

.question{
margin:60px auto;
width:80%;
max-width:700px;
}

.qtext{
font-size:24px;
margin-bottom:30px;
}

/* MBTI丸 */

.scale{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
}

.circle{
border-radius:50%;
border:3px solid black;
cursor:pointer;
}

.c1{width:44px;height:44px;}
.c2{width:34px;height:34px;}
.c3{width:22px;height:22px;}
.c4{width:34px;height:34px;}
.c5{width:44px;height:44px;}

.selected{
background:black;
}

.labels{
display:flex;
justify-content:space-between;
margin-top:12px;
font-size:14px;
}

button{
margin:40px;
padding:16px 36px;
font-size:20px;
cursor:pointer;
}

#result{
display:none;
padding:40px;
font-size:20px;
max-width:700px;
margin:auto;
}

</style>
</head>

<body>

<h1>
⚽恋の戦術診断スタジアム⚽<br>
〜あなたの恋愛ポジションはどこ!?〜
</h1>

<div id="questions"></div>

<button onclick="showResult()">結果を見る</button>

<div id="result"></div>

<script>

/* 質問（あと26問追加できる） */

const questions=[

{
text:"好きな人がほかの異性と話してたらどのくらい嫉妬する？",
left:"めっちゃする",
right:"あんまりしない"
},

{
text:"好きになったらどのくらい突っ走る？",
left:"止まらない",
right:"慎重"
},

{
text:"好きな人にどのくらいアピールする？",
left:"ガンガンする",
right:"様子を見る"
},

{
text:"恋愛では主導権握りたい？",
left:"握りたい",
right:"任せたい"
}

]

/* 質問生成 */

const container=document.getElementById("questions")

questions.forEach((q,i)=>{

let div=document.createElement("div")
div.className="question"

div.innerHTML=`
<div class="qtext">${i+1}. ${q.text}</div>

<div class="scale" data-q="${i}">
<div class="circle c1" data-v="1"></div>
<div class="circle c2" data-v="2"></div>
<div class="circle c3" data-v="3"></div>
<div class="circle c4" data-v="4"></div>
<div class="circle c5" data-v="5"></div>
</div>

<div class="labels">
<span>← ${q.left}</span>
<span>${q.right} →</span>
</div>
`

container.appendChild(div)

})

document.querySelectorAll(".circle").forEach(c=>{

c.onclick=()=>{

let parent=c.parentElement

parent.querySelectorAll(".circle").forEach(x=>x.classList.remove("selected"))

c.classList.add("selected")

parent.dataset.value=c.dataset.v

}

})

function showResult(){

let random=Math.floor(Math.random()*types.length)

</script>

</html>
